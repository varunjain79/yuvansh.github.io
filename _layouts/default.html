<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="{{ site.description }}">

  <!-- Google Identity -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>

  <style>
    :root {
      --bg-gradient: radial-gradient(circle at top, #111827 0, #020617 40%, #000000 100%);
      --card-bg: rgba(15, 23, 42, 0.92);
      --card-border: rgba(148, 163, 184, 0.2);
      --accent: #38bdf8;
      --text-main: #e5e7eb;
      --text-muted: #9ca3af;
    }

    body {
      margin: 0;
      font-family: system-ui, sans-serif;
      background: var(--bg-gradient);
      color: var(--text-main);
    }

    .nav-inner {
      max-width: 1080px;
      margin: 0 auto;
      padding: 10px 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    nav {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .nav-link {
      padding: 6px 10px;
      border-radius: 999px;
      text-decoration: none;
      background: rgba(15, 23, 42, 0.8);
      color: #e5e7eb;
      cursor: pointer;
    }

    .nav-link:hover {
      background: rgba(15, 23, 42, 1);
    }

    main {
      max-width: 1080px;
      margin: 20px auto;
      padding: 20px;
    }

    .login-box {
      margin-bottom: 20px;
      padding: 15px;
      border-radius: 12px;
      border: 1px solid #334155;
      background: rgba(15,23,42,0.9);
    }
  </style>
</head>

<body>

<header>
  <div class="nav-inner">
    <h2>Yuvansh’s Lab</h2>

    <nav>
      <a class="nav-link" href="/">Home</a>

      <a class="nav-link" href="#" onclick="protectPage(event, '/school/')">School</a>

      <a class="nav-link" href="#" onclick="protectPage(event, '/projects/')">Projects</a>

      <a class="nav-link" href="#" onclick="protectPage(event, '/ai/')">Custom AIs</a>

      <a class="nav-link" href="#" onclick="protectPage(event, '/youtube/')">YouTube</a>

      <a class="nav-link" href="#" onclick="protectPage(event, '/gallery/')">Gallery</a>

      <a class="nav-link" href="#" onclick="protectPage(event, '/updates/')">Updates</a>

      <a class="nav-link" href="#" onclick="protectPage(event, '/booking/')">Booking</a>
    </nav>
  </div>
</header>

<main>

  <!-- 🔐 GOOGLE LOGIN -->
  <div class="login-box">
    <h3>Login with Google</h3>

    <div id="g_id_onload"
         data-client_id="947445896989-a2uniqhbe95qtog2b2f40rq8c4mj1kjs.apps.googleusercontent.com"
         data-callback="handleCredentialResponse">
    </div>

    <div class="g_id_signin"
         data-type="standard"
         data-size="large">
    </div>
  </div>

  {{ content }}

</main>

<!-- 🧠 LOGIN + PROTECTION SCRIPT -->
<script>
  let isLoggedIn = false;

  function handleCredentialResponse(response) {
    const data = parseJwt(response.credential);
    isLoggedIn = true;

    alert("Welcome " + data.name);
  }

  function protectPage(event, url) {
    if (!isLoggedIn) {
      event.preventDefault();
      alert("Please login first!");
    } else {
      window.location.href = url;
    }
  }

  function parseJwt(token) {
    const base64Url = token.split('.')[1];
    const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
    const jsonPayload = decodeURIComponent(atob(base64).split('').map(function(c) {
      return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
    }).join(''));

    return JSON.parse(jsonPayload);
  }
</script>

</body>
</html>
