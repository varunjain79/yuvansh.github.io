<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us</title>
    <script src="https://www.google.com/recaptcha/api.js" async defer></script>
    <script>
        function copyPhoneNumber() {
            const phoneNumber = document.getElementById('phoneNumber');
            navigator.clipboard.writeText(phoneNumber.textContent);
            alert('Phone number copied to clipboard!');
        }

        function onSubmit(token) {
            document.getElementById('ideaForm').submit();
        }
    </script>
</head>
<body>
    <h1>Contact Us</h1>
    <p id="phoneNumber">+91 70451 59459</p>
    <button onclick="copyPhoneNumber()">Copy Phone Number</button>
    <p>WhatsApp only</p>
    <h2>Share Your Project Ideas</h2>
    <form id="ideaForm" action="/submit-idea" method="POST">
        <label for="idea">Your Idea:</label><br>
        <textarea id="idea" name="idea" rows="4" cols="50" required></textarea><br>
        <button class="g-recaptcha" 
                data-sitekey="6LdAcactAAAAAN7Lshu8OgTHh2TB5881Vk0b7snm"
                data-callback='onSubmit'
                data-action='submit'>
            Submit
        </button>
    </form>
</body>
</html>
